<header class="site-header">
  <div class="site-title"><a href="{{ "/" | relURL }}">{{ .Site.Title }}</a></div>
  <nav class="main">
    {{ range .Site.Menus.main }}
      {{ $active := or (eq $.RelPermalink .URL) (and (ne .URL "/") (hasPrefix $.RelPermalink .URL)) }}
      <a href="{{ .URL | relURL }}"{{ if $active }} class="active"{{ end }}>{{ .Name }}</a>
    {{ end }}
  </nav>
</header>
