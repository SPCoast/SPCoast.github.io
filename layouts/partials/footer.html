<script>
  (function () {
    function formatLocalDateTime(date) {
      return new Intl.DateTimeFormat(navigator.language || 'en-US', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        timeZoneName: 'short'
      }).format(date);
    }

    function localizeDateTimes() {
      document.querySelectorAll('.js-local-datetime, .js-local-publish-time').forEach(function (node) {
        var utcValue = node.getAttribute('data-utc') || node.getAttribute('datetime');
        if (!utcValue) return;
        var parsed = new Date(utcValue);
        if (Number.isNaN(parsed.getTime())) return;
        node.textContent = formatLocalDateTime(parsed);
        node.setAttribute('title', 'UTC: ' + utcValue);
      });
    }

    function tabLabel(link) {
      return (link.getAttribute('data-tab-label') || link.textContent || '').trim();
    }

    function tabPublishedMillis(link) {
      var published = link.getAttribute('data-tab-published');
      if (!published) return null;
      var millis = Date.parse(published);
      return Number.isNaN(millis) ? null : millis;
    }

    function pickDefaultVersionLink(links) {
      var bestLink = links[0];
      links.forEach(function (link, index) {
        if (index === 0) return;

        var bestMillis = tabPublishedMillis(bestLink);
        var linkMillis = tabPublishedMillis(link);

        if (linkMillis !== null || bestMillis !== null) {
          if (linkMillis !== null && (bestMillis === null || linkMillis > bestMillis)) {
            bestLink = link;
            return;
          }
          if (bestMillis !== null && (linkMillis === null || linkMillis < bestMillis)) {
            return;
          }
        }

        if (tabLabel(link).localeCompare(tabLabel(bestLink), undefined, { numeric: true, sensitivity: 'base' }) > 0) {
          bestLink = link;
        }
      });
      return bestLink;
    }

    function syncVersionTabs() {
      document.querySelectorAll('.version-tabs').forEach(function (tabsNode) {
        var links = tabsNode.querySelectorAll('.tab-strip .tab-link[data-tab-target]');
        var panels = tabsNode.querySelectorAll('.version-panels .version-panel[id]');
        if (!links.length) return;

        var hashTarget = window.location.hash ? window.location.hash.slice(1) : '';
        var activeLink = null;

        if (hashTarget) {
          links.forEach(function (link) {
            if (activeLink) return;
            if (link.getAttribute('data-tab-target') === hashTarget) {
              activeLink = link;
            }
          });
        }

        if (!activeLink) {
          activeLink = pickDefaultVersionLink(links);
        }
        var activeTarget = activeLink.getAttribute('data-tab-target') || '';

        links.forEach(function (link) {
          var isActive = link === activeLink;
          link.classList.toggle('is-active', isActive);
          if (isActive) {
            link.setAttribute('aria-current', 'page');
          } else {
            link.removeAttribute('aria-current');
          }
        });

        panels.forEach(function (panel, index) {
          var isActivePanel = panel.id === activeTarget || (!activeTarget && index === 0);
          panel.classList.toggle('is-active', isActivePanel);
          panel.hidden = !isActivePanel;
          panel.style.display = isActivePanel ? 'block' : 'none';
        });
      });
    }

    function bindVersionTabClicks() {
      if (!window.history || typeof window.history.replaceState !== 'function') return;
      document.addEventListener('click', function (event) {
        if (event.defaultPrevented || event.button !== 0) return;
        if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;

        var link = event.target.closest('.version-tabs .tab-strip .tab-link[data-tab-target]');
        if (!link) return;

        var target = link.getAttribute('data-tab-target');
        if (!target) return;

        event.preventDefault();
        window.history.replaceState(
          window.history.state,
          '',
          window.location.pathname + window.location.search + '#' + target
        );
        syncVersionTabs();
      });
    }

    function initializeUi() {
      localizeDateTimes();
      bindVersionTabClicks();
      syncVersionTabs();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initializeUi);
    } else {
      initializeUi();
    }

    window.addEventListener('hashchange', syncVersionTabs);
  })();
</script>
